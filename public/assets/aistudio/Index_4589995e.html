<div id="loginView" class="hidden"><div class="card"><h2>관리자 로그인</h2><label>담당 구분</label><select id="role"><option value="1">1호차 관리자</option><option value="2">2호차 관리자</option><option value="master">총괄 관리자</option></select><label>비밀번호</label><input id="password" type="password" placeholder="관리자 비밀번호"><button class="primary" style="width:100%;margin-top:14px" onclick="signIn()">로그인</button><p class="muted">비밀번호 오류 5회 시 15분간 로그인이 제한됩니다. 담당 버스만 수정할 수 있습니다. 버스 변경은 총괄 관리자 전용입니다.</p></div></div>
<div id="adminView" class="hidden"><nav class="dashboard-nav" aria-label="관리 화면 바로가기"><a href="#dashboardSummary">탑승 현황</a><a href="#dashboardRoster">탑승 명단</a></nav><div class="row"><h2 id="adminTitle">탑승 관리</h2><button onclick="signOut()">로그아웃</button></div><div class="tabs"><button id="adminOut" class="primary" onclick="choosePhase('출발')">출발</button><button id="adminBack" onclick="choosePhase('귀가')">귀가</button></div><div id="masterBus" class="hidden"><label>관리 버스</label><select id="busChoice" onchange="renderAdmin()"><option value="1">1호차</option><option value="2">2호차</option></select></div><div class="card" id="dashboardSummary"><div class="row"><h2 id="busTitle">1호차</h2><span id="closedChip" class="chip"></span></div><div id="boardingProgress" class="progress-wrap" aria-live="polite"></div><div id="stats" class="stats"></div><p class="muted" id="extraStats"></p><div class="actions"><button onclick="setClosedAction()" id="closeBtn">체크 마감</button><button onclick="setFinalAction()" id="finalBtn">최종 확인</button><button onclick="refreshAdmin()">새로고침</button><button id="resetStopBtn" class="reset-stop-btn" onclick="resetStopAction()">전체 미탑승 초기화</button></div><p class="muted">체크를 마감하고 현장에서 실제 인원을 대조한 뒤 최종 확인을 눌러주세요.</p><div class="actions"><button onclick="diagnoseSpeed()">속도 진단</button><span id="speedInfo" class="muted" aria-live="polite"></span></div></div><div class="card" id="dashboardRoster"><h2>탑승 명단</h2><input id="adminSearch" placeholder="이름 또는 부서 검색" oninput="renderAdmin()"><label>상태 필터</label><select id="statusFilter" onchange="renderAdmin()"><option value="전체">전체</option><option value="미탑승">미탑승</option><option value="탑승">탑승</option><option value="불참">불참</option><option value="개별이동">개별 이동</option></select><div id="adminList"></div></div></div></main>
<script>
let phase='출발',mode='self',token='',role='',publicPeople=[],adminData=null;let pendingActions=new Set(),latestLookup=0,latestAdmin=0;const lookupCache=new Map(),dashboardCache=new Map();let nameDirectory=[];let exceptionMenuId=null;const selfPending=new Set();const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));}
function clone(v){return JSON.parse(JSON.stringify(v));}
function localAdminKey(){return phase+'|'+role;}
function markPending(key,on){if(on)pendingActions.add(key);else pendingActions.delete(key);}
function clearLocalCaches(){lookupCache.clear();dashboardCache.clear();}
function msg(t,bad=false){$('message').textContent=t;$('message').className=bad?'error':'success';}
async function run(fn){try{msg('처리 중...');await fn();msg('완료되었습니다.');}catch(e){msg(e.message||String(e),true);}}
async function preloadNames(){try{nameDirectory=await call('getNameDirectory');showNameCandidates();}catch(e){/* 이름 직접 입력은 계속 사용 가능 */}}
function showNameCandidates(){latestLookup++;publicPeople=[];$('topContact').classList.add('hidden');$('selfList').innerHTML='';const q=$('search').value.trim();$('nameCandidates').innerHTML=!q?'':nameDirectory.filter(p=>p.name.includes(q)).slice(0,12).map(p=>`<button onclick="selectName('${safe(p.name)}')"><strong>${safe(p.name)}</strong><span>${safe(p.dept)}</span></button>`).join('');}
function selectName(name){$('search').value=name;$('nameCandidates').innerHTML='';lookupSelf();}
function resetSelfLookup(){$('selfSearchRow').classList.remove('hidden');$('resetSelfBtn').classList.add('hidden');$('search').value='';loadPublic();$('search').focus();}
function toggleMode(){mode=mode==='self'?'login':'self';drawMode();if(mode==='self')loadPublic();}
function drawMode(){ $('selfView').classList.toggle('hidden',mode!=='self');$('loginView').classList.toggle('hidden',mode!=='login');$('adminView').classList.toggle('hidden',mode!=='admin');$('modeBtn').textContent=mode==='self'?'관리자':'교직원 화면';}
function choosePhase(p){if(phase===p)return;if(pendingActions.size){msg('관리자 변경사항 저장 중입니다. 잠시 기다려 주세요.',true);return;}phase=p;['selfOut','adminOut'].forEach(id=>$(id).classList.toggle('primary',p==='출발'));['selfBack','adminBack'].forEach(id=>$(id).classList.toggle('primary',p==='귀가'));if(mode==='admin'){const cached=dashboardCache.get(localAdminKey());if(cached){adminData=clone(cached.data);renderAdmin();if(Date.now()-cached.at>12000)refreshAdmin();}else refreshAdmin();}else loadPublic();}
async function loadPublic(){latestLookup++;publicPeople=[];$('selfSearchRow').classList.remove('hidden');$('resetSelfBtn').classList.add('hidden');$('topContact').classList.add('hidden');$('nameCandidates').innerHTML='';$('selfList').innerHTML='<p class="muted">이름을 입력하면 실명 후보가 표시됩니다. 본인 이름을 선택해 주세요.</p>';}
async function lookupSelf(){
 const name=$('search').value.trim(),requestPhase=phase,request=++latestLookup;
 if(!/^[가-힣]{3}$/.test(name)){msg('실제 이름 3글자를 입력해 주세요.',true);return;}
 const key=requestPhase+'|'+name,cached=lookupCache.get(key);
 if(cached&&Date.now()-cached.at<10000){publicPeople=clone(cached.data);renderSelf();msg('조회되었습니다.');return;}
 $('selfList').innerHTML='<p class="muted">명단 확인 중…</p>';msg('조회 중…');
 try{const data=await call('findMyName',name,requestPhase);if(request!==latestLookup||phase!==requestPhase)return;
 publicPeople=data;lookupCache.set(key,{data:clone(data),at:Date.now()});renderSelf();msg('조회되었습니다.');
 }catch(e){if(request===latestLookup)msg(e.message||String(e),true);}
}
function renderSelf(){
 const a=publicPeople;
 if(a.length){$('selfSearchRow').classList.add('hidden');$('nameCandidates').innerHTML='';$('resetSelfBtn').classList.remove('hidden');}else{$('selfSearchRow').classList.remove('hidden');$('resetSelfBtn').classList.add('hidden');}
 // One contact bar only, above the roster. Hide for ambiguous bus matches.
 const buses=[...new Set(a.map(p=>String(p.bus)))];
 const phone=(a.length&&buses.length===1)?String(a[0].contact||'').replace(/[^0-9+]/g,''):'';
 $('topContact').classList.toggle('hidden',!phone);
 $('topCall').href=phone?'tel:'+phone:'#';
 $('topSms').href=phone?'sms:'+phone:'#';
 $('selfList').innerHTML=!a.length?'<p class="muted">일치하는 명단이 없습니다. 이름을 확인하거나 담당자에게 문의하세요.</p>':a.map(p=>`<div class="self-check-panel"><div class="self-check-title"><strong>${safe(p.name)}</strong><span class="self-school">${safe(p.dept)}</span></div><div class="self-bus">${p.bus}호차 · ${phase} · <strong>${safe(p.status)}</strong></div>${selfPending.has(p.id)?'<div class="self-saving">탑승 확인 요청됨<small>구글 시트에 저장 중입니다. 완료 안내가 나올 때까지 기다려 주세요.</small></div>':p.status==='탑승'?'<div class="self-done">✓ 탑승 확인 완료 · 저장됨</div>':p.status!=='미탑승'?'<div class="self-closed">현재 상태: '+safe(p.status)+' · 관리자에게 문의하세요.</div>':p.closed?'<div class="self-closed">탑승 확인이 마감되었습니다. 담당자에게 문의하세요.</div>':`<label class="self-check-label"><input type="checkbox" id="selfAgree_${safe(p.id)}" onchange="toggleSelfCheck('${safe(p.id)}')"><span>버스에 탑승했습니다.</span></label><button class="self-confirm" id="selfConfirm_${safe(p.id)}" disabled onclick="selfAction('${safe(p.id)}')">탑승 확인 완료하기</button>`}</div>`).join('');
}
function toggleSelfCheck(id){const c=document.getElementById('selfAgree_'+id),b=document.getElementById('selfConfirm_'+id);if(c&&b)b.disabled=!c.checked;}
async function selfAction(id){
 const p=publicPeople.find(x=>x.id===id),name=$('search').value.trim(),check=document.getElementById('selfAgree_'+id);
 if(!p||!check||!check.checked){msg('버스에 탑승한 후 체크해 주세요.',true);return;}
 if(selfPending.has(id))return;
 const requestPhase=phase;
 selfPending.add(id);renderSelf();msg('탑승 확인 요청됨 · 저장 중…');
 try{
   await call('selfCheck',name,id,requestPhase);
   clearLocalCaches();
   if(phase===requestPhase){const current=publicPeople.find(x=>x.id===id);if(current){current.status='탑승';}msg('탑승 확인이 저장되었습니다.');}
 }catch(e){
   if(phase===requestPhase)msg('저장 실패: '+(e.message||String(e))+' · 다시 시도해 주세요.',true);
 }finally{
   selfPending.delete(id);
   if(phase===requestPhase)renderSelf();
 }
}
async function signIn(){await run(async()=>{const result=await call('loginWithDashboard',$('role').value,$('password').value,phase);const r=result.session;token=r.token;role=r.role;mode='admin';$('password').value='';$('masterBus').classList.toggle('hidden',role!=='master');$('busChoice').value=role==='master'?'1':role;adminData=result.data;dashboardCache.set(localAdminKey(),{data:clone(adminData),at:Date.now()});drawMode();renderAdmin();});}
function currentBus(){return Number(role==='master'?$('busChoice').value:role);}
async function signOut(){if(token)await call('logout',token).catch(()=>{});token='';role='';mode='self';adminData=null;clearLocalCaches();drawMode();loadPublic();}
async function refreshAdmin(){if(pendingActions.size){msg('변경사항 저장 중입니다. 저장 완료 후 새로고침해 주세요.');return;}const requestedPhase=phase,request=++latestAdmin;
 try{const data=await call('dashboard',token,requestedPhase);if(request!==latestAdmin||phase!==requestedPhase||mode!=='admin')return;
 adminData=data;dashboardCache.set(localAdminKey(),{data:clone(data),at:Date.now()});renderAdmin();msg('최신 현황을 불러왔습니다.');
 }catch(e){if(request===latestAdmin){msg(e.message||String(e),true);if(String(e.message).includes('만료'))signOut();}}}
function cacheCurrentDashboard(){dashboardCache.set(localAdminKey(),{data:clone(adminData),at:Date.now()});}
async function mutateFast(key,fn,apply){if(pendingActions.size){msg('이전 변경을 저장 중입니다. 잠시 기다려 주세요.',true);return;}
 markPending(key,true);msg('변경사항 저장 중…');const start=performance.now();
 try{const response=await fn();apply(response);cacheCurrentDashboard();renderAdmin();msg('저장 완료 · '+((performance.now()-start)/1000).toFixed(1)+'초');}
 catch(e){msg('저장 실패: '+(e.message||String(e)),true);renderAdmin();}
 finally{markPending(key,false);}}
async function diagnoseSpeed(){if(!token)return;const el=$('speedInfo');el.textContent='측정 중…';const start=performance.now();try{const r=await call('speedDiagnostic',token,phase);const elapsed=Math.round(performance.now()-start);el.textContent='전체 '+elapsed+'ms / 서버 '+r.serverMs+'ms / 명단 '+r.peopleMs+'ms / 기록 '+r.recordsMs+'ms';}catch(e){el.textContent='진단 실패: '+(e.message||String(e));}}
function renderAdmin(){if(!adminData)return;const b=currentBus(),s=adminData.settings[phase+'|'+b]||{},a=adminData.people.filter(p=>p.bus===b),n=st=>a.filter(p=>p.status===st).length; $('adminTitle').textContent=(role==='master'?'총괄 관리자':b+'호차 관리자')+' · '+phase;$('busTitle').textContent=b+'호차 탑승 현황';$('closedChip').textContent=s.closed?'체크 마감':'체크 진행 중';$('closedChip').className='chip '+(s.closed?'warn':'ok');$('stats').innerHTML=`<div class="stat">탑승 대상<strong>${a.length-n('불참')-n('개별이동')}</strong></div><div class="stat">탑승 완료<strong>${n('탑승')}</strong></div><div class="stat">미탑승<strong>${n('미탑승')}</strong></div>`;$('extraStats').textContent=`불참 ${n('불참')}명 · 개별 이동 ${n('개별이동')}명 · ${s.final?'최종 확인 완료':'최종 확인 전'}`;$('closeBtn').textContent=s.closed?'체크 재개':'체크 마감';$('finalBtn').textContent=s.final?'최종 확인 해제':'최종 확인';$('finalBtn').disabled=!s.final&&(n('미탑승')>0||!s.closed);$('resetStopBtn').disabled=pendingActions.size>0;
const boarded=n('탑승'), total=a.length, pct=total?Math.round(boarded/total*100):0;
$('boardingProgress').innerHTML=`<div class="progress-top"><span><strong>${boarded}</strong> / ${total}명 탑승</span><strong>${pct}%</strong></div><div class="progress-track" role="progressbar" aria-label="${b}호차 탑승률" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${pct}%"></div></div>`;
const q=$('adminSearch').value.trim(),f=$('statusFilter').value;
const filtered=a.map((p,i)=>({...p,seq:i+1})).filter(p=>(!q||p.name.includes(q)||p.dept.includes(q))&&(f==='전체'||p.status===f));
$('adminList').innerHTML=filtered.length?filtered.map(p=>{
 const locked=!!(s.closed||s.final),busy=pendingActions.has('status:'+phase+':'+p.id);
 const exception=p.status==='불참'||p.status==='개별이동';
 const label=p.status==='탑승'?'✓ 탑승':exception?p.status==='개별이동'?'개별':'불참':'미탑승';
 const boardClass=p.status==='탑승'?'is-boarded':exception?'is-exception':'';
 const buttons=locked?`<span class="chip warn">${safe(p.status)} · 잠금</span>`:
 `<button class="board-toggle ${boardClass}" aria-label="${safe(p.name)} 탑승 상태 전환" ${busy?'disabled':''} onclick="toggleBoarding('${safe(p.id)}')">${busy?'저장 중…':label}</button><button class="exception-toggle" aria-label="${safe(p.name)} 불참 및 개별이동" ${busy?'disabled':''} onclick="toggleException('${safe(p.id)}')">⋯</button>`;
 const menu=(!locked&&exceptionMenuId===p.id)?`<div class="exception-menu"><button onclick="statusAction('${safe(p.id)}','불참')">불참</button><button onclick="statusAction('${safe(p.id)}','개별이동')">개별이동</button><button onclick="statusAction('${safe(p.id)}','미탑승')">미탑승 복원</button></div>`:'';
 return `<div class="person compact"><div class="who"><span class="seq">${p.seq}.</span><strong>${safe(p.name)}</strong><span class="school-inline">${safe(String(p.dept||'').split(' / ')[0].trim())}</span></div><div class="actions">${buttons}${role==='master'?`<button onclick="moveAction('${safe(p.id)}')">호차↔</button>`:''}</div></div>${menu}`;
 }).join(''):'<p class="muted">해당 인원이 없습니다.</p>';}
function toggleException(id){exceptionMenuId=exceptionMenuId===id?null:id;renderAdmin();}
function toggleBoarding(id){const p=adminData?.people.find(x=>x.id===id);if(!p)return;statusAction(id,p.status==='탑승'?'미탑승':'탑승');}

async function statusAction(id,v){
 if(!v||!adminData)return;
 if([...pendingActions].some(k=>k.startsWith('reset:'))){msg('초기화가 진행 중입니다.',true);return;}
 const p=adminData.people.find(x=>x.id===id);
 if(!p||p.status===v)return;
 const requestPhase=phase,requestData=adminData,key='status:'+requestPhase+':'+id;
 if(pendingActions.has(key))return;
 const oldStatus=p.status;
 pendingActions.add(key);exceptionMenuId=null;
 p.status=v;renderAdmin();msg('변경사항 저장 중…');
 try{
   await call('quickSetStatus',token,id,requestPhase,v);
   if(adminData===requestData){cacheCurrentDashboard();msg('탑승 상태가 저장되었습니다.');}
 }catch(e){
   if(adminData===requestData){p.status=oldStatus;msg('저장 실패 · 이전 상태로 복원했습니다: '+(e.message||String(e)),true);}
 }finally{
   pendingActions.delete(key);
   if(adminData===requestData&&phase===requestPhase)renderAdmin();
 }
}
async function resetStopAction(){
 if(!adminData||!token)return;
 if(pendingActions.size||selfPending.size){msg('저장 중인 작업이 있습니다. 완료 후 초기화해 주세요.',true);return;}
 const b=currentBus(),requestPhase=phase;
 const first=`${b}호차 · ${requestPhase} 탑승 현황을 전원 미탑승으로 초기화할까요?\n\n중간 정차 후 재탑승을 확인할 때 사용합니다. 기존 탑승·불참·개별이동 상태가 모두 미탑승으로 바뀌며, 마감과 최종 확인도 해제됩니다. 다른 호차와 다른 구간은 유지됩니다.`;
 if(!confirm(first))return;
 if(!confirm(`최종 확인: ${b}호차 ${requestPhase}의 모든 탑승 상태를 초기화합니다. 진행할까요?`))return;
 const key='reset:'+requestPhase+':'+b;
 pendingActions.add(key);renderAdmin();msg('초기화 중… 저장이 완료될 때까지 기다려 주세요.');
 try{
  const r=await call('resetBoardingForStop',token,requestPhase,b);
  dashboardCache.clear();lookupCache.clear();
  // 서버 기록을 다시 읽어 동기화: 다른 관리자 변경까지 정확히 반영
  const data=await call('dashboard',token,requestPhase);
  if(phase===requestPhase&&mode==='admin'){
   adminData=data;cacheCurrentDashboard();
   msg(`${b}호차 ${requestPhase}: ${r.count}명 미탑승으로 초기화 완료. 다시 체크할 수 있습니다.`);
  }
 }catch(e){msg('초기화 실패: '+(e.message||String(e))+' · 새로고침 후 상태를 확인해 주세요.',true);}
 finally{pendingActions.delete(key);if(mode==='admin')renderAdmin();}
}
async function setClosedAction(){const b=currentBus(),s=adminData.settings[phase+'|'+b];if(!confirm(`${b}호차 ${phase} 체크를 ${s.closed?'재개':'마감'}할까요?`))return;await mutateFast('closed:'+b,()=>call('quickSetClosed',token,phase,b,!s.closed),r=>{adminData.settings[phase+'|'+b].closed=r.closed;});}
async function setFinalAction(){const b=currentBus(),s=adminData.settings[phase+'|'+b];if(!confirm(`${b}호차 ${phase} 최종 확인을 ${s.final?'해제':'완료'}할까요?`))return;await mutateFast('final:'+b,()=>call('quickSetFinal',token,phase,b,!s.final),r=>{adminData.settings[phase+'|'+b].final=r.final;});}
async function moveAction(id){const p=adminData.people.find(x=>x.id===id),next=p.bus===1?2:1;if(!confirm(`${p.name} 선생님을 ${phase} ${next}호차로 변경할까요?`))return;await mutateFast('move:'+id,()=>call('quickMoveBus',token,id,phase,next),r=>{p.bus=r.bus;});}
loadPublic();

preloadNames();
</script></body></html>
